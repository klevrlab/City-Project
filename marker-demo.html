<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way AR - Marker Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/utils/checkpoint-loader.js"></script>
    <script type="module" src="./src/utils/shared-map-markers.js"></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./src/css/marker-demo-styles.css" />
</head>

<body>
    <!-- Top bar -->
    <div id="topbar">
        <a href="./index.html" class="back">&larr;</a>
        <h1>Marker Demo</h1>
        
    </div>

    <!-- Navigation Menu -->
    <div id="info-panel">
        <img id="event-icon" src="./assets/SharkLogo.png" alt="Event" onerror="this.style.display='none'">
        <h2>Sharks Way Tour</h2>
        <p>Point camera at Hiro marker</p>
        <!-- <p class="marker-hint">Get marker: bit.ly/hiro-marker</p> -->
    </div>

    <!-- Map Component -->
    <div id="map-container">
        <button id="toggle-map" aria-label="Open map">
            <svg class="map-fab-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="2,5 9,3 9,21 2,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="9,3 17,5 17,23 9,21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.55)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="17,5 24,3 24,21 17,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <path d="M5 14 Q7 10 9 12 Q11 14 13 10" stroke="#00A9E0" stroke-width="1.3" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
                <path
                    d="M19 4.5 C17.07 4.5 15.5 6.07 15.5 8 C15.5 10.5 19 14.5 19 14.5 C19 14.5 22.5 10.5 22.5 8 C22.5 6.07 20.93 4.5 19 4.5Z"
                    fill="#00A9E0" stroke="rgba(0,18,24,0.4)" stroke-width="0.8" />
                <circle cx="19" cy="8" r="1.6" fill="rgba(0,18,24,0.55)" />
            </svg>
            <span class="map-icon-close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </span>
        </button>
        <div id="mini-map"></div>
    </div>

    <!-- <div id="tap-hint">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v14m7-7H5"/></svg>
        Tap marker to learn more
    </div> -->

    <div id="progress-tracker">
        <div style="font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                style="width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none;">
                <!-- <circle cx="12" cy="12" r="10" />
                <path d="m9 12 2 2 4-4" /> -->
            </svg>
            Tour Progress
        </div>
        <div class="stop-item" data-checkpoint="A" id="checkpoint-a">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
        </div>
        <div class="stop-item" data-checkpoint="B" id="checkpoint-b">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
        </div>
    </div>

    <div id="event-info">
        <h3 id="event-title">Event Loading...</h3>
        <div class="event-details">
            <p id="event-date"></p>
            <p id="event-location"></p>
            <p class="event-description" id="event-description"></p>
        </div>
        <div id="sharkey-message"></div>
        <button class="cta-button" id="learn-more">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
                <path d="M17 2 12 7 7 2" />
            </svg>
            Learn More
        </button>
    </div>

    <!-- DEV: GLB Model Switcher -->
    <!-- <div id="dev-switcher" style="position:fixed;top:12px;right:12px;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-family:monospace;font-size:13px;color:#0ff;border:1px solid rgba(0,255,255,0.3);">
        <span style="font-size:11px;opacity:0.7;white-space:nowrap;">🛠 DEV MODEL</span>
        <select id="glb-select" style="background:#111;color:#0ff;border:1px solid #0ff;border-radius:6px;padding:4px 8px;font-family:monospace;font-size:13px;cursor:pointer;outline:none;">
            <option value="./assets/3D-models/plushie_shark.glb">plushie_shark</option>
            <option value="./assets/3D-models/MARIA_SHARK.glb">MARIA_SHARK</option>
            <option value="./assets/3D-models/MARIA_SHARK_ANIMATED.glb">MARIA_SHARK_ANIMATED</option>
            <option value="./assets/3D-models/SHAUN_SHARK.glb">SHAUN_SHARK</option>
            <option value="./assets/3D-models/SHAUN_SHARK_ANIMATED.glb">SHAUN_SHARK_ANIMATED</option>
            <option value="./assets/3D-models/STELLA_CAI_SHARK_SJSU_TEST1.glb">STELLA_CAI_SHARK</option>
        </select>
    </div> -->
    <script>
        document.getElementById('glb-select').addEventListener('change', function () {
            var asset = document.getElementById('shark-model');
            if (asset) {
                asset.setAttribute('src', this.value);
                var entity = document.getElementById('sharkey');
                if (entity) {
                    entity.setAttribute('gltf-model', this.value);
                }
            }
        });
    </script>

    <a-scene embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; precision: medium;">

        <a-assets>
            <a-asset-item id="shark-model" src="./assets/3D-models/plushie_shark.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="./pattern-shark.patt" id="hiro-marker" class="clickable">
            <!-- Sharkie 3D Model -->
            <a-entity id="sharkey" gltf-model="#shark-model" position="0 0.5 0" rotation="0 180 0" scale="0.5 0.5 0.5"
                animation="property: rotation; to: 0 190 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine"
                animation__float="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
            </a-entity>

            <!-- Fallback box (visible if model doesn't load) -->
            <a-box id="fallback-shark" position="0 0.5 0" width="0.3" height="0.2" depth="0.6" color="#006D75"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
            </a-box>

            <!-- Tour stop platform -->
            <a-cylinder position="0 0 0" radius="0.6" height="0.1" color="#F4901E"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
            </a-cylinder>

            <!-- Floating text with background -->
            <a-plane position="0 1.2 0" width="1.2" height="0.3" color="#006D75" opacity="0.7"
                animation="property: position; to: 0 1.35 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
            </a-plane>
            <a-text value="Sharkie's\nTour Stop" align="center" color="#FFFFFF" position="0 1.21 0.01"
                scale="0.4 0.4 0.4"
                animation="property: position; to: 0 1.36 0.01; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
            </a-text>

            <!-- Orbiting rings -->
            <a-torus position="0 0.5 0" radius="0.5" radius-tubular="0.03" color="#00A9E0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            </a-torus>

            <a-torus position="0 0.5 0" radius="0.7" radius-tubular="0.02" color="#F4901E" rotation="90 0 0"
                animation="property: rotation; to: 90 360 0; loop: true; dur: 6000; easing: linear">
            </a-torus>

            <!-- Particle effects (stars) -->
            <a-entity id="particles">
                <a-sphere position="0.5 1.2 0.3" radius="0.03" color="#FFD700"
                    animation="property: position; to: 0.5 1.5 0.3; dir: alternate; loop: true; dur: 1500"></a-sphere>
                <a-sphere position="-0.4 1.0 -0.2" radius="0.03" color="#FFD700"
                    animation="property: position; to: -0.4 1.3 -0.2; dir: alternate; loop: true; dur: 1800"></a-sphere>
                <a-sphere position="0.3 1.4 -0.4" radius="0.03" color="#FFD700"
                    animation="property: position; to: 0.3 1.7 -0.4; dir: alternate; loop: true; dur: 2000"></a-sphere>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const dummyEvents = [
            {
                title: "The Big Game",
                date: "February 9, 2026",
                time: "3:30 PM PST",
                location: "SAP Center, San Jose",
                description: "Experience the ultimate showdown! Join thousands of fans for an unforgettable game day.",
                sharkeyMessage: "Hey there! I'm Sharkie, and this is where the magic happens! SAP Center hosts over 200 events per year. Arrive early to grab some teal gear!",
                icon: "./assets/SharkLogo.png"
            },
            {
                title: "March Madness Watch Party",
                date: "March 15-April 6, 2026",
                time: "Various Times",
                location: "Downtown San Jose",
                description: "Catch all the tournament action on giant screens across downtown venues.",
                sharkeyMessage: "Downtown SJ is buzzing! Over 40 restaurants and bars showing the games. San Pedro Square Market has the best viewing atmosphere!",
                icon: "./march-madness.svg"
            },
            {
                title: "World Cup Viewing",
                date: "June-July 2026",
                time: "Match Times Vary",
                location: "San Pedro Square Market",
                description: "Cheer for your team with fans from around the world in the heart of SJ.",
                sharkeyMessage: "¡Hola! This historic market has been a gathering place since 1863. Try food from different countries while watching their teams play!",
                icon: "./world-cup.svg"
            }
        ];

        let currentEventIndex = 0;
        let visitedStops = new Set();
        const eventInfo = document.getElementById('event-info');
        const marker = document.querySelector('#hiro-marker');
        const tapHint = document.getElementById('tap-hint');
        let markerVisible = false;
        let soundEnabled = true;

        function playSound(type) {
            if (!soundEnabled) return;
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'found') {
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } else if (type === 'tap') {
                oscillator.frequency.value = 1200;
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            }
        }

        function showEvent(event) {
            document.getElementById('event-title').textContent = event.title;
            document.getElementById('event-date').innerHTML = `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${event.date} &bull; ${event.time}`;
            document.getElementById('event-location').innerHTML = `<svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${event.location}`;
            document.getElementById('event-description').textContent = event.description;
            document.getElementById('sharkey-message').textContent = event.sharkeyMessage;
            document.getElementById('event-icon').src = event.icon;
            if (eventInfo) eventInfo.classList.add('visible');

            visitedStops.add(currentEventIndex);
            updateProgress();
        }

        function updateProgress() {
            visitedStops.forEach(index => {
                const stopItem = document.querySelector(`.stop-item[data-stop="${index}"]`);
                if (stopItem) {
                    stopItem.classList.add('visited');
                    const checkIcon = stopItem.querySelector('.check-icon');
                    if (checkIcon) {
                        checkIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>';
                    }
                }
            });
        }

        marker.addEventListener('markerFound', () => {
            console.log('Marker detected!');
            markerVisible = true;
            const event = dummyEvents[currentEventIndex];
            showEvent(event);
            playSound('found');

            setTimeout(() => {
                if (markerVisible && tapHint) {
                    tapHint.classList.add('visible');
                }
            }, 2000);
        });

        marker.addEventListener('markerLost', () => {
            console.log('Marker lost');
            markerVisible = false;
            if (eventInfo) eventInfo.classList.remove('visible');
            if (tapHint) tapHint.classList.remove('visible');
        });

        document.getElementById('learn-more').addEventListener('click', () => {
            playSound('tap');
            alert(`Ready to attend ${dummyEvents[currentEventIndex].title}?\n\nIn the full version, this would:\n- Show ticket options\n- Add to calendar\n- Share with friends\n- Get directions`);

            currentEventIndex = (currentEventIndex + 1) % dummyEvents.length;
            const event = dummyEvents[currentEventIndex];
            showEvent(event);
        });

        // Navigation Menu
        const navMenu = document.getElementById('nav-menu');
        const navOverlay = document.getElementById('nav-overlay');
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const closeMenuBtn = document.getElementById('close-menu');

        function openMenu() {
            navMenu.classList.add('open');
            navOverlay.classList.add('visible');
            playSound('tap');
        }

        function closeMenu() {
            navMenu.classList.remove('open');
            navOverlay.classList.remove('visible');
            playSound('tap');
        }

        hamburgerBtn.addEventListener('click', openMenu);
        hamburgerBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            openMenu();
        });

        closeMenuBtn.addEventListener('click', closeMenu);
        closeMenuBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            closeMenu();
        });

        navOverlay.addEventListener('click', closeMenu);
        navOverlay.addEventListener('touchend', (e) => {
            e.preventDefault();
            closeMenu();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && navMenu.classList.contains('open')) {
                closeMenu();
            }
        });
    </script>

    <!-- GPS Tracking for Checkpoints -->
    <script type="module" src="./src/utils/shared-gps-tracking.js"></script>

    <script>
        const scene = document.querySelector('a-scene');
        scene.addEventListener('click', (e) => {
            if (markerVisible && e.target.closest('#hiro-marker')) {
                playSound('tap');
                tapHint.classList.remove('visible');
            }
        });

        // Model loading debug
        const sharkModel = document.querySelector('#shark-model');
        if (sharkModel) {
            sharkModel.addEventListener('loaded', () => {
                console.log('✅ Shark GLB model loaded successfully');
                const fallback = document.querySelector('#fallback-shark');
                if (fallback) fallback.setAttribute('visible', 'false');
            });
            sharkModel.addEventListener('error', (e) => {
                console.error('❌ Error loading shark model:', e);
                console.log('Make sure plushie_shark.glb is in assets/3D-models/ folder');
            });
        }

        const sharkEntity = document.querySelector('#sharkey');
        if (sharkEntity) {
            sharkEntity.addEventListener('model-loaded', () => {
                console.log('✅ Shark entity model loaded');
                const fallback = document.querySelector('#fallback-shark');
                if (fallback) fallback.setAttribute('visible', 'false');
            });
            sharkEntity.addEventListener('model-error', (e) => {
                console.error('❌ Shark entity error:', e);
            });
        }

        window.addEventListener('load', () => {
            console.log('Sharks Way AR Demo Enhanced Version loaded');
            console.log('Print Hiro marker from: https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png');
            console.log('Looking for: ./assets/3D-models/plushie_shark.glb');
        });

        // Map functionality
        var map = null;
        var userMarker = null;
        var userLat = null;
        var userLng = null;

        function initializeMap() {
            if (map) return;

            var mapContainer = document.getElementById('mini-map');
            map = L.map(mapContainer, {
                zoomControl: false,
                attributionControl: true
            }).setView([37.3352, -121.8811], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);
        }

        function updateMap() {
            if (!map || !userLat || !userLng) return;

            map.setView([userLat, userLng], 16);

            // Use shared marker system
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.contains('expanded');
            userMarker = updateMapMarkers(map, userLat, userLng, userMarker, isExpanded);
        }

        document.getElementById('toggle-map').addEventListener('click', function () {
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.toggle('expanded');


            setTimeout(function () {
                if (map) {
                    map.invalidateSize();
                    updateMap();
                }
            }, 400);
        });

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function (position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;

                    if (!map) {
                        initializeMap();
                    }
                    updateMap();
                },
                function (error) {
                    console.error('Geolocation error:', error);
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }

        setTimeout(function () {
            if (!map) {
                initializeMap();
            }
        }, 1000);
    </script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
