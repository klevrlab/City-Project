<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Shark Detection (8th Wall)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/utils/checkpoint-loader.js"></script>
    <script type="module" src="./src/utils/shared-map-markers.js"></script>
    
    <!-- Core AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script type="module" src="./src/utils/shark-embedding-detector.js"></script>
    <script type="module" src="./src/utils/xr8-shark-video-bridge.js"></script>

    <!-- 1. 8th Wall Engine & Extras (2026 Distributed Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam" async></script>
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous" async></script>
    
    <!-- A-Frame Extras for Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <!-- Project Source -->
    <script type="module" src="./src/utils/audio-utils.js"></script>
    <script type="module" src="./src/utils/math-utils.js"></script>
    <script type="module" src="./src/systems/event-system.js"></script>
    <script type="module" src="./src/components/shark-detector.js"></script>
    <script type="module" src="./src/components/shark-animator.js"></script>
    <script type="module" src="./src/components/tour-ui.js"></script>
    <script type="module" src="./src/app.js"></script>

    <link rel="stylesheet" href="./src/css/sharks-way-styles.css" />
</head>

<body>
    <!-- Top bar -->
    <div id="topbar">
        <a href="./index.html" class="back">&larr;</a>
        <h1>Shark Detection (8W)</h1>
        
    </div>

    <!-- Tap Instruction Overlay -->
    <div id="tap-instruction">Tap the ground to bring a shark to life</div>

    <!-- Navigation Menu -->
    <div class="stop-item" data-checkpoint="A" id="checkpoint-a">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            San Pedro Square
        </div>
        <div class="stop-item" data-checkpoint="B" id="checkpoint-b">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            Sharks Way
        </div>
    </div>

    <!-- Map Component -->
    <div id="map-container">
        <button id="toggle-map" aria-label="Open map">
            <svg class="map-fab-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="2,5 9,3 9,21 2,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="9,3 17,5 17,23 9,21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="17,5 24,3 24,21 17,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linejoin="round" />
                <path d="M5 14 Q7 10 9 12 Q11 14 13 10" stroke="#00A9E0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                <path d="M19 4.5 C17.07 4.5 15.5 6.07 15.5 8 C15.5 10.5 19 14.5 19 14.5 C19 14.5 22.5 10.5 22.5 8 C22.5 6.07 20.93 4.5 19 4.5Z" fill="#00A9E0" stroke="rgba(0,18,24,0.4)" stroke-width="0.8" />
                <circle cx="19" cy="8" r="1.6" fill="rgba(0,18,24,0.55)" />
            </svg>
            <span class="map-icon-close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </span>
        </button>
        <div id="mini-map"></div>
    </div>

    <div id="info-panel">
        <h2 style="font-size:14px; margin-bottom:8px;">Welcome to Sharks Way</h2>
        <p style="font-size:12px; opacity:0.8;">Point your phone at a Sharks Way mural to bring the street to life.</p>
    </div>

    <!-- 8th Wall A-Frame scene -->
    <a-scene id="xrscene" 
        xrextras-almost-there
        xrextras-runtime-error
        xrextras-loading
        xrweb
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true;"
        tour-ui shark-detector="useGps: true">

        <a-assets>
            <a-asset-item id="maria-swimmer" src="./assets/3D-models/SEAN_ANIMATED_WiTH_MARIA_SHARK.glb"></a-asset-item>
            <a-asset-item id="jimmy-swimmer" src="./assets/3D-models/jimmy-shark-swimmer.glb"></a-asset-item>
            <a-asset-item id="sharkie-wave" src="./assets/3D-models/sharkieflipped.glb"></a-asset-item>
            <a-asset-item id="diving-shark" src="./assets/3D-models/maria-shark-jump-jimmy-txtr.glb"></a-asset-item>
            <a-asset-item id="stella-swimmer" src="./assets/3D-models/StellaFlipped.glb"></a-asset-item>
        </a-assets>

        <!-- Lighting for AR Shadows -->
        <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
        <a-entity light="type: directional; castShadow: true; intensity: 0.8; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowCameraTop: 20; shadowCameraBottom: -20; shadowCameraRight: 20; shadowCameraLeft: -20; target: #camera" position="5 10 5"></a-entity>

        <!-- Shadow Ground Plane (Clickable for spawning) -->
        <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="1000" height="1000" material="shader: shadow; opacity: 0.4;" shadow="receive: true"></a-plane>

        <!-- Shark Content -->
        <a-entity id="shark-root" position="0 0 0" visible="false" shark-animator>
        </a-entity>

        <a-camera id="camera" position="0 1.6 0"></a-camera>
    </a-scene>

    <!-- Nav and map interactions handled by tour-ui.js -->

    <!-- GPS Tracking for Checkpoints -->
    <script type="module" src="./src/utils/shared-gps-tracking.js"></script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
