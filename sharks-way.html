<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Shark Painting Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./css/map-component.css" />
    <link rel="stylesheet" href="./css/progress-tracker.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./JS/checkpoint-loader.js"></script>
    <script src="./JS/shared-map-markers.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            position: fixed;
            inset: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        /* Camera feed */
        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        #debug-canvas {
            display: none;
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 22, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 169, 224, 0.2);
            border-top-color: #00A9E0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        #loading p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        #loading-status {
            margin-top: 12px;
            font-size: 12px;
            color: #00A9E0;
        }

        /* Info panel (bottom-right) — from marker-demo */
        #info-panel {
            position: fixed;
            top: 50px;
            left: 20px;
            background: rgba(0, 109, 117, 0.15);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: white;
            padding: 18px 16px;
            border-radius: 20px;
            z-index: 100;
            width: 140px;
            height: auto;
            border: 1px solid rgba(0, 169, 224, 0.3);
            box-shadow: 0 8px 32px rgba(0, 109, 117, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        #info-panel h2 {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        #info-panel p {
            margin: 6px 0;
            font-size: 12px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.85);
        }

        #info-panel .status-text {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 169, 224, 0.2);
            line-height: 1.3;
        }

        /* Event info slide-in (left) — from marker-demo */
        #event-info {
            position: fixed;
            top: 170px;
            left: -460px;
            transform: translateY(-50%);
            background: rgba(0, 109, 117, 0.15);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            z-index: 1000;
            max-width: 280px;
            border: 1px solid rgba(0, 169, 224, 0.3);
            box-shadow: 0 8px 32px rgba(0, 109, 117, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: left 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #event-info.visible {
            left: 20px;
        }

        #event-info h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        #event-info .event-details {
            font-size: 13px;
            line-height: 1.6;
        }

        #event-info .event-details p {
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 6px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .cta-button {
            background: rgba(0, 169, 224, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 169, 224, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 169, 224, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: block;
            width: 100%;
        }

        .cta-button:active {
            transform: scale(0.95);
            background: rgba(0, 169, 224, 0.5);
        }

        #event-icon {
            width: 45px;
            height: 45px;
            margin: 0 auto 10px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
            object-fit: contain;
        }

        #progress-tracker .gps-status {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 169, 224, 0.2);
        }


        /* 3D Model overlay */
        #model-overlay {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 420px;
            height: 420px;
            z-index: 50;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        #model-overlay.visible {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
            background: transparent;
        }

        /* Glow ring behind the model */
        #model-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 169, 224, 0.15) 0%, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        /* Shark name label under model */
        #shark-label {
            position: fixed;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 109, 117, 0.25);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(0, 169, 224, 0.4);
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 169, 224, 0.2);
        }

        #shark-label.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #shark-label .label-name {
            color: #00A9E0;
        }

        #shark-label .label-score {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 8px;
        }

        /* Scanning animation */
        #scan-line {
            position: fixed;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00A9E0, transparent);
            box-shadow: 0 0 12px #00A9E0;
            opacity: 0;
            z-index: 5;
            animation: scanMove 2.5s ease-in-out infinite;
        }

        #scan-line.active {
            opacity: 0.6;
        }

        @keyframes scanMove {
            0% {
                top: 15%;
            }

            50% {
                top: 85%;
            }

            100% {
                top: 15%;
            }
        }

        /* Corner brackets */
        .corner {
            position: fixed;
            width: 30px;
            height: 30px;
            border-color: rgba(0, 169, 224, 0.5);
            border-style: solid;
            border-width: 0;
            z-index: 5;
        }

        .corner.tl {
            top: 12%;
            left: 10%;
            border-top-width: 2px;
            border-left-width: 2px;
            border-radius: 4px 0 0 0;
        }

        .corner.tr {
            top: 12%;
            right: 10%;
            border-top-width: 2px;
            border-right-width: 2px;
            border-radius: 0 4px 0 0;
        }

        .corner.bl {
            bottom: 12%;
            left: 10%;
            border-bottom-width: 2px;
            border-left-width: 2px;
            border-radius: 0 0 0 4px;
        }

        .corner.br {
            bottom: 12%;
            right: 10%;
            border-bottom-width: 2px;
            border-right-width: 2px;
            border-radius: 0 0 4px 0;
        }

        /* Top bar */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 14px;
            background: linear-gradient(to bottom, rgba(0, 22, 26, 0.7) 0%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        #topbar h1 {
            font-size: 14px;
            font-weight: 700;
            flex: 1;
        }

        #topbar .back {
            color: #00A9E0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        #hamburger-btn {
            background: rgba(0, 169, 224, 0.25);
            border: 1px solid rgba(0, 169, 224, 0.4);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
            margin-left: auto;
            position: relative;
            z-index: 101;
            -webkit-tap-highlight-color: transparent;
        }

        #hamburger-btn:active {
            transform: scale(0.95);
            background: rgba(0, 169, 224, 0.4);
        }

        #hamburger-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        #topbar .top-btn {
            background: rgba(0, 169, 224, 0.25);
            border: 1px solid rgba(0, 169, 224, 0.4);
            color: #fff;
            border-radius: 20px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        #topbar .top-btn:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #topbar .top-btn.top-btn--warn {
            border-color: rgba(255, 177, 0, 0.6);
            background: rgba(255, 177, 0, 0.18);
        }

        #trained-badge {
            margin-left: auto;
            background: rgba(0, 169, 224, 0.25);
            border: 1px solid rgba(0, 169, 224, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateX(-50%) scale(1.05);
                opacity: 0.9;
            }
        }

        /* Navigation Menu */
        #nav-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(0, 22, 26, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-left: 1px solid rgba(0, 169, 224, 0.3);
            z-index: 150;
            transition: right 0.3s ease;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }

        #nav-menu.open {
            right: 0;
        }

        #nav-menu .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 169, 224, 0.25);
            border: 1px solid rgba(0, 169, 224, 0.4);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            padding: 0;
        }

        #nav-menu h2 {
            color: #00A9E0;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        #nav-menu .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: rgba(0, 169, 224, 0.1);
            border: 1px solid rgba(0, 169, 224, 0.2);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        #nav-menu .nav-link:hover,
        #nav-menu .nav-link:active {
            background: rgba(0, 169, 224, 0.25);
            border-color: rgba(0, 169, 224, 0.4);
            transform: translateX(-4px);
        }

        #nav-menu .nav-link svg {
            width: 20px;
            height: 20px;
            stroke: #00A9E0;
            stroke-width: 2;
            fill: none;
        }

        #nav-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #nav-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 480px) {
            #info-panel {
                top: 50px;
                left: 10px;
                width: 150px;
                height: auto;
                padding: 14px 12px;
            }

            #info-panel h2 {
                font-size: 13px;
            }

            #info-panel p {
                font-size: 11px;
            }

            #event-info {
                max-width: 90%;
                padding: 14px 16px;
            }

            #event-info.visible {
                left: 10px;
            }

            #event-info h3 {
                font-size: 15px;
            }

            #event-info .event-details {
                font-size: 12px;
            }

            #model-overlay {
                width: 340px;
                height: 340px;
            }

            .cta-button {
                padding: 10px 16px;
                font-size: 13px;
            }

            #topbar .top-btn {
                padding: 5px 8px;
                font-size: 10px;
            }

            #nav-menu {
                width: 85%;
                max-width: 320px;
            }
        }

        /* Shark + video plane overlay (fallback, no AR) */
        #shark-plane-overlay {
            position: fixed;
            inset: 0;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #shark-plane-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #shark-plane-overlay a-scene {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #shark-plane-overlay canvas {
            background: transparent !important;
        }

        /* March Madness promo: bouncing basketball */
        #basketball-promo {
            position: fixed;
            left: 24px;
            bottom: 22%;
            width: 120px;
            height: 120px;
            z-index: 95;
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px) scale(0.7);
            transition: opacity 0.25s ease, transform 0.25s ease;
            will-change: transform, opacity;
        }
        #basketball-promo.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        #basketball-promo .basketball-shell {
            width: 100%;
            height: 100%;
            animation: basketballBounce 1.15s ease-in-out infinite;
            transform-origin: center bottom;
        }
        #basketball-model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
            --poster-color: transparent;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
        }
        @keyframes basketballBounce {
            0% { transform: translateY(0) scale(1, 1); }
            20% { transform: translateY(-26px) scale(1.03, 0.97); }
            45% { transform: translateY(-92px) scale(1.04, 0.96); }
            70% { transform: translateY(-20px) scale(0.98, 1.02); }
            100% { transform: translateY(0) scale(1, 1); }
        }

        @media (max-width: 480px) {
            #basketball-promo {
                width: 92px;
                height: 92px;
                left: 12px;
                bottom: 24%;
            }
        }
        
        /* ── Sharks Way: map FAB icon (page-scoped) ── */
        @keyframes map-fab-pulse {

            0%,
            100% {
                box-shadow: 0 4px 18px rgba(0, 109, 117, 0.55), 0 0 0 0 rgba(0, 169, 224, 0.4);
            }

            60% {
                box-shadow: 0 4px 18px rgba(0, 109, 117, 0.55), 0 0 0 8px rgba(0, 169, 224, 0);
            }
        }

        #map-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 18, 24, 0.82);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1.5px solid rgba(0, 169, 224, 0.45);
            box-shadow: 0 4px 18px rgba(0, 109, 117, 0.55),
                0 0 0 0 rgba(0, 169, 224, 0.4);
            overflow: visible;
            animation: map-fab-pulse 3s ease-in-out infinite;
            transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                border-radius 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s ease,
                animation 0s;
            right: 14px;
            bottom: 22px;
        }

        #map-container.expanded {
            width: min(300px, calc(100vw - 28px));
            height: min(300px, 45vh);
            border-radius: 16px;
            overflow: hidden;
            animation: none;
            box-shadow: 0 8px 40px rgba(0, 109, 117, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        /* map tile */
        #mini-map {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease 0.15s;
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        #map-container.expanded #mini-map {
            opacity: 1;
            pointer-events: auto;
        }

        /* FAB button */
        #toggle-map {
            position: absolute;
            inset: 0;
            width: 50px;
            height: 50px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            padding: 0;
            font-size: unset;
            font-weight: unset;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #toggle-map:active {
            transform: scale(0.85);
        }

        /* map SVG icon */
        .map-fab-icon {
            width: 26px;
            height: 26px;
            display: block;
            flex-shrink: 0;
        }

        /* close icon */
        .map-icon-close {
            display: none;
            width: 15px;
            height: 15px;
            color: rgba(255, 255, 255, 0.9);
        }

        .map-icon-close svg {
            width: 15px;
            height: 15px;
        }

        #map-container.expanded .map-fab-icon {
            display: none;
        }

        #map-container.expanded .map-icon-close {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #map-container.expanded #toggle-map {
            inset: auto;
            top: 7px;
            right: 7px;
            width: 27px;
            height: 27px;
            background: rgba(0, 18, 24, 0.78);
            border: 1px solid rgba(0, 169, 224, 0.35);
            border-radius: 50%;
            backdrop-filter: blur(8px);
        }

        /* responsive */
        @media (max-width: 480px) {
            #map-container {
                width: 46px;
                height: 46px;
                right: 10px;
                bottom: 16px;
            }

            #toggle-map {
                width: 46px;
                height: 46px;
            }

            .map-fab-icon {
                width: 24px;
                height: 24px;
            }

            #map-container.expanded {
                width: min(260px, calc(100vw - 20px));
                height: min(260px, 40vh);
            }
        }

        */
    </style>
</head>

<body>
    <!-- Camera feed -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="debug-canvas" width="224" height="224"></canvas>

    <!-- Loading overlay -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>Sharks Way</h2>
        <p>Getting everything ready...</p>
        <div id="loading-status">Please wait</div>
    </div>

    <!-- Top bar -->
    <div id="topbar">

    <script>
        const SEARCH_PARAMS = new URLSearchParams(window.location.search || '');
        const CAVEMAN_DEBUG = false;
        const CAVEMAN_FREEZE = false;
        const CAVEMAN_RIG0_TUNER = false;
        const CAVEMAN_TUNER_RIG_INDEX = 1;

        function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
        function getResponsiveScale() {
            const minDim = Math.min(window.innerWidth || 0, window.innerHeight || 0);
            if (minDim <= 420) return 0.6;
            if (minDim <= 720) return 0.8;
            return 1.0;
        }
        function applyVideoPlaneLayout(opts) {
            const { videoEl, planeEl, shadowEl } = opts || {};
            if (!planeEl) return;
            const scale = getResponsiveScale();
            const baseHeight = 1.0 * scale;
            const aspect = (videoEl && videoEl.videoWidth && videoEl.videoHeight)
                ? (videoEl.videoWidth / videoEl.videoHeight) : 1;
            const width = clamp(baseHeight * aspect, 0.9 * scale, 1.6 * scale);
            const posX = 0.85 * scale, posZ = -0.85 * scale, videoY = 0.12 * scale;
            const shadowY = 0.01, shadowPad = 0.18 * scale;
            planeEl.setAttribute('position', `${posX} ${videoY} ${posZ}`);
            planeEl.setAttribute('width', width);
            planeEl.setAttribute('height', baseHeight);
            if (shadowEl) {
                shadowEl.setAttribute('position', `${posX} ${shadowY} ${posZ}`);
                shadowEl.setAttribute('width', width + shadowPad);
                shadowEl.setAttribute('height', baseHeight + shadowPad);
            }
        }

        if (typeof AFRAME !== 'undefined') {
            AFRAME.registerComponent('video-fact-cycle', {
                schema: {
                    intervalMs: { type: 'number', default: 8000 },
                    visibleMs: { type: 'number', default: 4000 },
                    animMs: { type: 'number', default: 500 },
                    videoId: { type: 'string', default: 'videoTexture' },
                    shadowSelector: { type: 'string', default: '.video-shadow' }
                },
                init: function () {
                    this._timer = null;
                    this._cycle = this._cycle.bind(this);
                    this.shadowEl = this.el.parentElement && this.data.shadowSelector
                        ? this.el.parentElement.querySelector(this.data.shadowSelector) : null;
                },
                playOnce: function () { this._cycle(); },
                stop: function () {
                    if (this._timer) { clearInterval(this._timer); this._timer = null; }
                    this.el.removeAttribute('animation__factIn');
                    this.el.removeAttribute('animation__factOut');
                    this.el.setAttribute('scale', '0.001 0.001 0.001');
                    if (this.shadowEl) {
                        this.shadowEl.removeAttribute('animation__shadowIn');
                        this.shadowEl.removeAttribute('animation__shadowOut');
                        this.shadowEl.setAttribute('scale', '0.001 0.001 0.001');
                    }
                    const videoEl = document.getElementById(this.data.videoId);
                    if (videoEl) videoEl.pause();
                },
                _cycle: function () {
                    const videoEl = document.getElementById(this.data.videoId);
                    if (videoEl) {
                        const duration = Number.isFinite(videoEl.duration) ? videoEl.duration : 0;
                        if (duration > 4) {
                            const maxStart = Math.max(duration - 4, 0.1);
                            videoEl.currentTime = Math.random() * maxStart;
                        }
                        videoEl.play().catch(function () { });
                    }
                    this.el.setAttribute('scale', '0.001 0.001 0.001');
                    this.el.setAttribute('animation__factIn', {
                        property: 'scale', from: '0.001 0.001 0.001', to: '1 1 1',
                        dur: this.data.animMs, easing: 'easeOutBack'
                    });
                    if (this.shadowEl) {
                        this.shadowEl.setAttribute('scale', '0.001 0.001 0.001');
                        this.shadowEl.setAttribute('animation__shadowIn', {
                            property: 'scale', from: '0.001 0.001 0.001', to: '1 1 1',
                            dur: this.data.animMs, easing: 'easeOutBack'
                        });
                    }
                    const self = this;
                    setTimeout(function () {
                        self.el.setAttribute('animation__factOut', {
                            property: 'scale', from: '1 1 1', to: '0.001 0.001 0.001',
                            dur: self.data.animMs, easing: 'easeInCubic'
                        });
                        if (self.shadowEl) {
                            self.shadowEl.setAttribute('animation__shadowOut', {
                                property: 'scale', from: '1 1 1', to: '0.001 0.001 0.001',
                                dur: self.data.animMs, easing: 'easeInCubic'
                            });
                        }
                        if (videoEl) videoEl.pause();
                    }, this.data.visibleMs);
                }
            });

            AFRAME.registerComponent('mural-shark-content', {
                init: function () {
                    const self = this;
                    self.root = self.el;
                    self.cyclingActive = false;
                    self.currentSharkIndex = 0;
                    self.sharkTimers = [];
                    self.modelDebug = [{ loaded: false, mesh: false, size: '-' }, { loaded: false, mesh: false, size: '-' }];
                    self.debugEl = document.getElementById('caveman-debug');
                    self.debugText = '';
                    self.root.innerHTML = [
                        '<a-plane class="video-shadow" visible="false" position="0.85 0.01 -0.85" rotation="-90 0 0" width="1.2" height="1.2" material="color: #000000; opacity: 0.22; transparent: true; depthWrite: false"></a-plane>',
                        '<a-plane class="shark-video-plane" visible="false" position="0.85 0.05 -0.85" rotation="-90 0 0" width="1.0" height="1.0" material="shader: flat; src: #videoTexture; transparent: true; color: #000000"></a-plane>',
                        '<a-entity class="shark-rig-1" visible="false" position="0 1.0 0" rotation="0 0 0" scale="0.55 0.55 0.55">',
                        '  <a-box class="debug-proxy" visible="false" depth="0.8" height="0.35" width="1.6" material="color: #ff00ff; opacity: 0.95"></a-box>',
                        '  <a-entity class="shark-model-1" gltf-model="#sharkModel1" position="0 -0.85 0" rotation="0 0 0" animation-mixer="loop: repeat; timeScale: 1.0" shadow="cast: true; receive: false"></a-entity>',
                        '</a-entity>',
                        '<a-entity class="shark-rig-2" visible="false" position="0 1.0 0" rotation="0 0 0" scale="0.55 0.55 0.55">',
                        '  <a-box class="debug-proxy" visible="false" depth="0.8" height="0.35" width="1.6" material="color: #00ff00; opacity: 0.95"></a-box>',
                        '  <a-entity class="shark-model-2" gltf-model="#sharkModel2" position="0 -0.85 0" rotation="0 180 0" animation-mixer="loop: repeat; timeScale: 1.0" shadow="cast: true; receive: false"></a-entity>',
                        '</a-entity>'
                    ].join('');
                    self.sharkVideoPlane = self.root.querySelector('.shark-video-plane');
                    self.sharkVideoShadow = self.root.querySelector('.video-shadow');
                    if (self.sharkVideoPlane) {
                        self.sharkVideoPlane.setAttribute('video-fact-cycle', 'intervalMs: 8000; visibleMs: 4000; animMs: 500; videoId: videoTexture');
                    }
                    self.sharkRigs = [self.root.querySelector('.shark-rig-1'), self.root.querySelector('.shark-rig-2')];
                    self.sharkModels = [self.root.querySelector('.shark-model-1'), self.root.querySelector('.shark-model-2')];
                    self.debugProxies = Array.from(self.root.querySelectorAll('.debug-proxy'));
                    if (CAVEMAN_DEBUG) {
                        (self.debugProxies || []).forEach(function (proxy) { proxy.setAttribute('visible', true); });
                        (self.sharkRigs || []).forEach(function (rig) {
                            if (!rig || !rig.object3D || typeof THREE === 'undefined') return;
                            if (rig.object3D.getObjectByName('debug-axes')) return;
                            var axes = new THREE.AxesHelper(0.8);
                            axes.name = 'debug-axes';
                            rig.object3D.add(axes);
                        });
                        if (self.debugEl) self.debugEl.hidden = false;
                    }
                    self.updateDebug = function (extra) {
                        if (!CAVEMAN_DEBUG || !self.debugEl) return;
                        var r0 = (self.sharkRigs && self.sharkRigs[0]) ? self.sharkRigs[0].getAttribute('position') : null;
                        var r1 = (self.sharkRigs && self.sharkRigs[1]) ? self.sharkRigs[1].getAttribute('position') : null;
                        var lines = [
                            'CAVEMAN DEBUG ON',
                            'cycling=' + self.cyclingActive + ' idx=' + self.currentSharkIndex,
                            'rig0 vis=' + !!(self.sharkRigs && self.sharkRigs[0] && self.sharkRigs[0].getAttribute('visible')) + ' pos=' + (r0 ? `${r0.x.toFixed(2)},${r0.y.toFixed(2)},${r0.z.toFixed(2)}` : '-'),
                            'rig1 vis=' + !!(self.sharkRigs && self.sharkRigs[1] && self.sharkRigs[1].getAttribute('visible')) + ' pos=' + (r1 ? `${r1.x.toFixed(2)},${r1.y.toFixed(2)},${r1.z.toFixed(2)}` : '-'),
                            `m1 loaded=${self.modelDebug[0].loaded} mesh=${self.modelDebug[0].mesh} bbox=${self.modelDebug[0].size}`,
                            `m2 loaded=${self.modelDebug[1].loaded} mesh=${self.modelDebug[1].mesh} bbox=${self.modelDebug[1].size}`,
                            extra || ''
                        ];
                        self.debugEl.textContent = lines.filter(Boolean).join('\n');
                    };
                    self.sharkModels.forEach(function (modelEl, idx) {
                        if (!modelEl) return;
                        modelEl.addEventListener('model-loaded', function () {
                            var mesh = modelEl.getObject3D('mesh');
                            self.modelDebug[idx].loaded = true;
                            self.modelDebug[idx].mesh = !!mesh;
                            if (mesh && typeof THREE !== 'undefined') {
                                try {
                                    var box = new THREE.Box3().setFromObject(mesh);
                                    var size = new THREE.Vector3();
                                    box.getSize(size);
                                    self.modelDebug[idx].size = `${size.x.toFixed(2)}x${size.y.toFixed(2)}x${size.z.toFixed(2)}`;

                                    // Recenter model around rig origin once so rig coords are meaningful.
                                    if (!modelEl.dataset.centered) {
                                        var center = new THREE.Vector3();
                                        box.getCenter(center);
                                        var basePos = modelEl.getAttribute('position') || { x: 0, y: 0, z: 0 };
                                        var px = Number(basePos.x || 0) - center.x;
                                        var py = Number(basePos.y || 0) - center.y;
                                        var pz = Number(basePos.z || 0) - center.z;
                                        modelEl.setAttribute('position', `${px} ${py} ${pz}`);
                                        modelEl.dataset.centered = 'true';
                                    }
                                } catch (e) {
                                    self.modelDebug[idx].size = 'bbox_err';
                                }
                            }
                            console.log('[CAVEMAN] model-loaded', idx, self.modelDebug[idx]);
                            self.updateDebug('model-loaded ' + idx);
                        });
                        modelEl.addEventListener('model-error', function (e) {
                            self.modelDebug[idx].loaded = false;
                            self.modelDebug[idx].mesh = false;
                            self.modelDebug[idx].size = 'load_err';
                            console.warn('[CAVEMAN] model-error', idx, e && e.detail);
                            self.updateDebug('model-error ' + idx);
                        });
                    });
                    self.updateVideoLayout = function () {
                        applyVideoPlaneLayout({
                            videoEl: document.getElementById('videoTexture'),
                            planeEl: self.sharkVideoPlane,
                            shadowEl: self.sharkVideoShadow
                        });
                    };
                    self.updateVideoLayout();
                    window.addEventListener('resize', self.updateVideoLayout);
                    self.updateDebug('init');
                },
                show: function () {
                    var self = this;
                    if (CAVEMAN_DEBUG && CAVEMAN_RIG0_TUNER) {
                        if (self.sharkVideoPlane) self.sharkVideoPlane.setAttribute('visible', false);
                        if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', false);
                        (self.sharkRigs || []).forEach(function (rig) {
                            if (!rig) return;
                            rig.removeAttribute('animation__swimPass');
                            rig.removeAttribute('animation__swimIn');
                            rig.removeAttribute('animation__swimOut');
                            rig.removeAttribute('animation__bob');
                            rig.setAttribute('visible', false);
                        });
                        self.cyclingActive = false;
                        var rigIndex = CAVEMAN_TUNER_RIG_INDEX;
                        var rig = (self.sharkRigs || [])[rigIndex];
                        if (rig) {
                            if (self.rigTunerHideTimer) clearTimeout(self.rigTunerHideTimer);
                            rig.setAttribute('visible', true);
                            rig.setAttribute('rotation', rigIndex === 0 ? '0 270 0' : '0 0 0');
                            rig.setAttribute('scale', '0.85 0.85 0.85');
                            rig.setAttribute('position', `${RIG0_TUNER.x.toFixed(2)} ${RIG0_TUNER.y.toFixed(2)} 2.50`);
                            rig.setAttribute('animation__swimPass', {
                                property: 'position',
                                from: `${RIG0_TUNER.x.toFixed(2)} ${RIG0_TUNER.y.toFixed(2)} 2.50`,
                                to: `${RIG0_TUNER.x.toFixed(2)} ${RIG0_TUNER.y.toFixed(2)} -15.00`,
                                dur: 3600,
                                easing: 'easeInOutSine'
                            });
                            var model0 = (self.sharkModels || [])[rigIndex];
                            if (model0) {
                                var mesh0 = model0.getObject3D('mesh');
                                if (mesh0) {
                                    mesh0.traverse(function (child) {
                                        if (!child.isMesh || !child.material) return;
                                        var mats = Array.isArray(child.material) ? child.material : [child.material];
                                        mats.forEach(function (mat) {
                                            mat.transparent = true;
                                            mat.opacity = 1.0;
                                            mat.needsUpdate = true;
                                        });
                                    });
                                }
                            }
                            setTimeout(function () {
                                var modelAtFade = (self.sharkModels || [])[rigIndex];
                                if (!modelAtFade) return;
                                var meshAtFade = modelAtFade.getObject3D('mesh');
                                if (!meshAtFade) return;
                                var fadeStart = performance.now();
                                var fadeDuration = 650;
                                function fadeStep(now) {

                                    meshAtFade.traverse(function (child) {
                                        if (!child.isMesh || !child.material) return;
                                        var mats = Array.isArray(child.material) ? child.material : [child.material];
                                        mats.forEach(function (mat) {
                                            mat.transparent = true;
                                            mat.opacity = opacity;
                                            mat.needsUpdate = true;
                                        });
                                    });
                                    if (t < 1) requestAnimationFrame(fadeStep);
                                }
                                requestAnimationFrame(fadeStep);
                            }, 3400);
                            self.rigTunerHideTimer = setTimeout(function () {
                                rig.removeAttribute('animation__swimPass');
                                rig.setAttribute('visible', false);
                                var modelAtHide = (self.sharkModels || [])[rigIndex];
                                if (modelAtHide) {
                                    var meshAtHide = modelAtHide.getObject3D('mesh');
                                    if (meshAtHide) {
                                        meshAtHide.traverse(function (child) {
                                            if (!child.isMesh || !child.material) return;
                                            var mats = Array.isArray(child.material) ? child.material : [child.material];
                                            mats.forEach(function (mat) {
                                                mat.transparent = true;
                                                mat.opacity = 1.0;
                                                mat.needsUpdate = true;
                                            });
                                        });
                                    }
                                }
                            }, 4100);
                        }
                        self.updateDebug('show: rig' + rigIndex + ' tuner mode');
                        return;
                    }
                    if (CAVEMAN_DEBUG && CAVEMAN_FREEZE) {
                        if (self.sharkVideoPlane) self.sharkVideoPlane.setAttribute('visible', false);
                        if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', false);
                        (self.sharkRigs || []).forEach(function (rig, i) {
                            if (!rig) return;
                            rig.removeAttribute('animation__swimPass');
                            rig.removeAttribute('animation__swimIn');
                            rig.removeAttribute('animation__swimOut');

                    (self.sharkRigs || []).forEach(function (rig) {

                        rig.removeAttribute('animation__swimOut');

                    if (self.sharkVideoPlane) {

                animateNextShark: function () {
                    var self = this;
                    if (!self.cyclingActive) return;
                    var sharkIndex = self.currentSharkIndex % 2;
                    var rig = (self.sharkRigs || [])[sharkIndex];
                    var modelEl = (self.sharkModels || [])[sharkIndex];
                    if (!rig) return;

                    // Start a bit further away, glide into the center,
                    // chill there briefly, then swim off into the distance.
                    var startY = sharkIndex === 0 ? 0.82 : 0.72;
                    var startZ = 8.0;
                    var centerZ = -2;
                    var endZ = -8.0;

                    var swimInDuration = 1800;
                    var chillDuration = 3200;
                    var swimOutDuration = 2400;
                    var totalDuration = swimInDuration + chillDuration + swimOutDuration;

                    rig.setAttribute('visible', true);
                    rig.setAttribute('rotation', sharkIndex === 0 ? '0 270 0' : '0 0 0');
                    rig.setAttribute('position', `0 ${startY} ${startZ}`);
                    rig.removeAttribute('animation__swimPass');
                    rig.removeAttribute('animation__swimIn');
                    rig.removeAttribute('animation__swimOut');

                    if (modelEl) {
                        var modelPos = modelEl.getAttribute('position') || { x: 0, y: 0, z: 0 };
                        var mx = Number(modelPos.x || 0);
                        var my = Number(modelPos.y || 0);
                        var mz = Number(modelPos.z || 0);
                        modelEl.setAttribute('animation__bobModel', {
                            property: 'position',
                            from: `${mx.toFixed(3)} ${(my - 0.08).toFixed(3)} ${mz.toFixed(3)}`,
                            to: `${mx.toFixed(3)} ${(my + 0.08).toFixed(3)} ${mz.toFixed(3)}`,
                            dir: 'alternate',
                            dur: 520,
                            easing: 'easeInOutSine',
                            loop: true
                        });
                        var mesh = modelEl.getObject3D('mesh');
                        if (mesh) {
                            mesh.traverse(function (child) {
                                if (!child.isMesh || !child.material) return;
                                var mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(function (mat) {
                                    mat.transparent = true;
                                    mat.opacity = 1.0;
                                    mat.needsUpdate = true;
                                });
                            });
                        }
                    }

                    rig.setAttribute('animation__swimIn', {
                        property: 'position',
                        from: `0 ${startY} ${startZ}`,
                        to: `0 ${startY} ${centerZ}`,
                        dur: swimInDuration,
                        easing: 'easeOutSine'
                    });

                    var swimOutTimer = setTimeout(function () {
                        if (!self.cyclingActive) return;
                        rig.setAttribute('animation__swimOut', {
                            property: 'position',
                            from: `0 ${startY} ${centerZ}`,
                            to: `0 ${startY} ${endZ}`,
                            dur: swimOutDuration,
                            easing: 'easeInSine'
                        });
                    }, swimInDuration + chillDuration);
                    self.sharkTimers.push(swimOutTimer);

                    var fadeDuration = 620;
                    var fadeLeadMs = 700;
                    var fadeDelay = Math.max(totalDuration - fadeLeadMs, 0);
                    var fadeTimer = setTimeout(function () {
                        if (!self.cyclingActive || !modelEl) return;
                        var fadeMesh = modelEl.getObject3D('mesh');
                        if (!fadeMesh) return;
                        var fadeStart = performance.now();
                        function fadeStep(now) {
                            if (!self.cyclingActive) return;
                            var t = Math.min((now - fadeStart) / fadeDuration, 1);
                            var opacity = 1 - t;
                            fadeMesh.traverse(function (child) {
                                if (!child.isMesh || !child.material) return;
                                var mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(function (mat) {
                                    mat.transparent = true;
                                    mat.opacity = opacity;
                                    mat.needsUpdate = true;
                                });
                            });
                            if (t < 1) requestAnimationFrame(fadeStep);
                        }
                        requestAnimationFrame(fadeStep);
                    }, fadeDelay);
                    self.sharkTimers.push(fadeTimer);

                    var hideTimer = setTimeout(function () {
                        rig.removeAttribute('animation__swimIn');
                        rig.removeAttribute('animation__swimOut');
                        rig.setAttribute('visible', false);
                        if (modelEl) {
                            modelEl.removeAttribute('animation__bobModel');
                            var meshAtHide = modelEl.getObject3D('mesh');
                            if (meshAtHide) {
                                meshAtHide.traverse(function (child) {
                                    if (!child.isMesh || !child.material) return;
                                    var mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach(function (mat) {
                                        mat.transparent = true;
                                        mat.opacity = 1.0;
                                        mat.needsUpdate = true;
                                    });
                                });
                            }
                        }
                        self.currentSharkIndex = (self.currentSharkIndex + 1) % 2;
                        if (self.cyclingActive) {
                            var nextTimer = setTimeout(function () {
                                self.animateNextShark();
                            }, 220);
                            self.sharkTimers.push(nextTimer);
                        }
                    }, totalDuration + 40);
                    self.sharkTimers.push(hideTimer);
                    self.updateDebug('animate idx=' + sharkIndex);
                },
                remove: function () {
                    this.hide();
                    if (this.updateVideoLayout) window.removeEventListener('resize', this.updateVideoLayout);
                }

        // Determine checkpoint status based on simple longitude check
        // "left of both check both, left of one check one, left of none check none"
        function evaluateCheckpoints(position) {
            const { latitude, longitude, accuracy } = position.coords;

            addGPSLog(`Position: ${latitude.toFixed(6)}, ${longitude.toFixed(6)} (±${accuracy.toFixed(1)}m)`);

            let checkedCount = 0;
            let status = '';

            // Check if user's longitude is "left of" (less than or equal to) the checkpoint's longitude
            if (longitude <= CHECKPOINTS.A.lng) {
                if (!STATE.checkpointA.visited) {
                    addGPSLog(`✓ Passed Checkpoint A`, 'checkpoint');
                }
                STATE.checkpointA.visited = true;
                checkedCount++;
            } else {
                STATE.checkpointA.visited = false;
            }

            if (longitude <= CHECKPOINTS.B.lng) {
                if (!STATE.checkpointB.visited) {
                    addGPSLog(`✓ Passed Checkpoint B`, 'checkpoint');
                }
                STATE.checkpointB.visited = true;
                checkedCount++;
            } else {
                STATE.checkpointB.visited = false;
            }

            // Set active state for UI and descriptive status
            if (STATE.checkpointA.visited && STATE.checkpointB.visited) {
                STATE.checkpointA.active = false;
                STATE.checkpointB.active = true;
                status = 'Left of both (checked both)';
            } else if (STATE.checkpointA.visited) {
                STATE.checkpointA.active = false;
                STATE.checkpointB.active = true;
                status = 'Left of one (checked A)';
            } else {
                STATE.checkpointA.active = true;
                STATE.checkpointB.active = false;
                status = 'Right of both (none checked)';
            }

            // Update GPS status display
            const gpsStatus = document.getElementById('gps-status');
            if (gpsStatus) {
                gpsStatus.textContent = `GPS: Longitude ${longitude.toFixed(5)} - ${status}`;
            }

            // Update UI
            updateCheckpointUI();
        }

        // Handle GPS errors

            let errorMsg = '';
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorMsg = 'GPS permission denied';
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMsg = 'GPS position unavailable';
                    break;
                case error.TIMEOUT:
                    errorMsg = 'GPS request timeout';
                    break;
                default:
                    errorMsg = 'GPS unknown error';
                    break;
            }

            addGPSLog(errorMsg, 'error');

            const gpsStatus = document.getElementById('gps-status');
            if (gpsStatus) {
                gpsStatus.textContent = `GPS: ${errorMsg}`;
            }
        }

        function playSound(type) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                if (type === 'found') {
                    oscillator.frequency.value = 800;
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                } else if (type === 'tap') {
                    oscillator.frequency.value = 1200;
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                }
            } catch (e) { /* ignore audio errors */ }
        }

        function hideFallbackSharks() {
            const muralSharkEl = document.getElementById('mural-shark-root');
            if (muralSharkEl && muralSharkEl.components && muralSharkEl.components['mural-shark-content']) {
                muralSharkEl.components['mural-shark-content'].hide();
            }
            if (ui.sharkPlaneOverlay) ui.sharkPlaneOverlay.classList.remove('visible');
        }

        function isMarchMadnessPromoActive(now = new Date()) {
            return now.getTime() < Date.parse(MARCH_MADNESS_PROMO_END_UTC);
        }

        function showBasketballPromo() {
            if (!ui.basketballPromo || !isMarchMadnessPromoActive()) return;
            if (STATE.basketballPromoTimer) {
                clearTimeout(STATE.basketballPromoTimer);
                STATE.basketballPromoTimer = null;
            }
            // Let the shark render first, then reveal promo.
            STATE.basketballPromoTimer = setTimeout(() => {
                ui.basketballPromo.classList.add('visible');
                STATE.basketballPromoTimer = null;
            }, 380);
        }

        function hideBasketballPromo() {
            if (!ui.basketballPromo) return;
            if (STATE.basketballPromoTimer) {
                clearTimeout(STATE.basketballPromoTimer);
                STATE.basketballPromoTimer = null;
            }
            ui.basketballPromo.classList.remove('visible');
        }

        // Force Animation debug button removed from UI.

        // ─── EMBEDDING FUNCTIONS ───
        function l2Normalize(vec) {
            let sum = 0;
            for (let i = 0; i < vec.length; i++) sum += vec[i] * vec[i];
            const norm = Math.sqrt(sum);
            if (norm === 0) return vec;
            const out = new Float32Array(vec.length);
            for (let i = 0; i < vec.length; i++) out[i] = vec[i] / norm;
            return out;
        }

        function cosineSimilarity(a, b) {
            let dot = 0;
            for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
            return dot;
        }

        function friendlyName(filename) {
            const m = filename.match(/shark(\d+)/i);
            return m ? `Shark ${parseInt(m[1])}` : filename.replace(/\.[^.]+$/, '');
        }

        function bestMatch(embedding) {
            const sharkScores = {};
            for (const item of STATE.enrolled) {
                const score = cosineSimilarity(embedding, item.embedding);
                const sharkId = friendlyName(item.name);
                if (!sharkScores[sharkId] || score > sharkScores[sharkId].score) {
                    sharkScores[sharkId] = { name: item.name, score };
                }
            }
            let best = { name: null, score: -1 };
            for (const key of Object.keys(sharkScores)) {
                if (sharkScores[key].score > best.score) best = sharkScores[key];
            }
            return best;
        }

        function rollingScore(currentMatch) {
            STATE.recentScores.push({ name: currentMatch.name, score: currentMatch.score });
            if (STATE.recentScores.length > STATE.ROLLING_N) STATE.recentScores.shift();

            const counts = {};
            let topName = null;
            let topCount = 0;
            for (const entry of STATE.recentScores) {
                if (!entry.name) continue;
                counts[entry.name] = (counts[entry.name] || 0) + 1;
                if (counts[entry.name] > topCount) {
                    topCount = counts[entry.name];
                    topName = entry.name;
                }
            }

            let sum = 0, n = 0;
            for (const entry of STATE.recentScores) {
                if (entry.name === topName) { sum += entry.score; n++; }
            }
            return { name: topName, score: n > 0 ? sum / n : 0, confidence: topCount / STATE.ROLLING_N };
        }

        function buildSharkGroups() {
            STATE.sharkGroups = {};
            for (const item of STATE.enrolled) {
                const id = friendlyName(item.name);
                if (!STATE.sharkGroups[id]) STATE.sharkGroups[id] = [];
                STATE.sharkGroups[id].push(item);
            }
        }

        function applyEmbeddings(data) {
            STATE.enrolled = data.map(item => ({
                name: item.name,
                embedding: new Float32Array(item.embedding)
            }));
            buildSharkGroups();
            const sharkCount = Object.keys(STATE.sharkGroups).length;
            console.log(`${sharkCount} sharks loaded`);
        }

        // ─── SILENT FALLBACK HELPERS ───
        function cropAndEmbed(imgEl, sx, sy, sw, sh) {
            const canvas = document.createElement('canvas');
            canvas.width = 224;
            canvas.height = 224;
            canvas.getContext('2d').drawImage(imgEl, sx, sy, sw, sh, 0, 0, 224, 224);
            return tf.tidy(() => {
                const t = tf.browser.fromPixels(canvas);
                return STATE.model.infer(t, true);
            });
        }

        // ─── LOADING ───
        async function loadEmbeddings() {
            ui.loadingStatus.textContent = 'Almost ready...';

            // 1. Try static JSON file (normal path)
            try {
                const resp = await fetch(EMBEDDINGS_URL);
                if (resp.ok) {
                    const data = await resp.json();
                    if (data && data.length > 0) { applyEmbeddings(data); return; }
                }
            } catch (e) { }

            // 2. Try localStorage cache
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (data && data.length > 0) { applyEmbeddings(data); return; }
                }
            } catch (e) { }

            throw new Error('Unable to load shark data');
        }

        async function loadModel() {
            ui.loadingStatus.textContent = 'Preparing camera...';
            await tf.ready();
            STATE.model = await mobilenet.load({ version: 2, alpha: 1.0 });
        }

        async function startCamera() {
            ui.loadingStatus.textContent = 'Starting camera...';
            STATE.stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            ui.video.srcObject = STATE.stream;
            await new Promise(r => { ui.video.onloadedmetadata = r; });
        }

        async function getFrameEmbedding() {
            const vw = ui.video.videoWidth;
            const vh = ui.video.videoHeight;
            const minDim = Math.min(vw, vh);
            const sx = (vw - minDim) / 2;
            const sy = (vh - minDim) / 2;
            const ctx = ui.debugCanvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(ui.video, sx, sy, minDim, minDim, 0, 0, 224, 224);
            const emb = tf.tidy(() => {
                const t = tf.browser.fromPixels(ui.debugCanvas);
                return STATE.model.infer(t, true);
            });
            const data = await emb.data();
            emb.dispose();
            return l2Normalize(new Float32Array(data));
        }

        // ─── SHARK FOUND / LOST ───
        function onSharkFound(name, score) {
            if (STATE.sharkVisible) return; // already showing
            STATE.sharkVisible = true;
            STATE.lastMatchTime = performance.now();

            // Always use the A-Frame fallback sharks overlay.
            showFallbackSharks();
            showBasketballPromo();
            // Show label
            ui.labelName.textContent = 'Follow Sharkie';
            ui.sharkLabel.classList.add('visible');

            // Show event info + sound
            showEvent(dummyEvents[STATE.currentEventIndex]);
            playSound('found');

        }

        function onSharkLost() {
            // Do nothing — shark stays until user dismisses
        }

        function dismissAll() {
            STATE.sharkVisible = false;
            STATE.dismissedAt = performance.now();
            STATE.recentScores = [];
            if (STATE.bannerDismissTimer) {
                clearTimeout(STATE.bannerDismissTimer);
                STATE.bannerDismissTimer = null;
            }
            ui.sharkLabel.classList.remove('visible');
            hideFallbackSharks();
            hideBasketballPromo();
            hideEvent();
        }

        // ─── GPS FALLBACK ───
        function haversineMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function updateGpsStatusText() {
            if (!ui.gpsStatus) return;
            if (STATE.gpsDistanceM == null) {
                ui.gpsStatus.textContent = 'GPS: waiting…';
                return;
            }
            const d = STATE.gpsDistanceM;
            const distText = d >= 1000 ? `${(d / 1000).toFixed(2)}km` : `${Math.round(d)}m`;
            ui.gpsStatus.textContent = `GPS: ${distText} from Sharks Way`;
        }

        function startGpsWatch() {
            if (!('geolocation' in navigator)) {
                if (ui.gpsStatus) ui.gpsStatus.textContent = 'GPS: unavailable';
                return;
            }

            try {
                if (STATE.gpsWatchId != null) navigator.geolocation.clearWatch(STATE.gpsWatchId);
            } catch (e) { /* ignore */ }

            STATE.gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const d = haversineMeters(lat, lng, GPS_TARGET.lat, GPS_TARGET.lng);
                    STATE.gpsDistanceM = d;
                    const inRange = d <= GPS_RADIUS_M;

                    // If user is close, force the "found" state even if ML can't see the mural (night/low light).
                    STATE.gpsActive = inRange;
                    updateGpsStatusText();

                    const cooldownOver = performance.now() - STATE.dismissedAt > 3000;
                    if (inRange && cooldownOver && !STATE.sharkVisible) {
                        onSharkFound('gps', 1.0);
                    }
                },
                (err) => {
                    console.warn('GPS error:', err);
                    STATE.gpsDistanceM = null;
                    STATE.gpsActive = false;
                    if (ui.gpsStatus) ui.gpsStatus.textContent = 'GPS: blocked';
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
            );
        }

        // ─── MAIN LOOP ───
        async function loop() {
            if (!STATE.running) return;

            try {
                if (!STATE.model || !STATE.stream || STATE.enrolled.length === 0) {
                    requestAnimationFrame(loop);
                    return;
                }

                const embedding = await getFrameEmbedding();
                const rawMatch = bestMatch(embedding);
                const smoothed = rollingScore(rawMatch);

                const cooldownOver = performance.now() - STATE.dismissedAt > 3000;
                const mlMatch = cooldownOver && smoothed.name && smoothed.score >= THRESHOLD && smoothed.confidence >= 0.4;
                const gpsMatch = cooldownOver && STATE.gpsActive;

                if (mlMatch || gpsMatch) {
                    STATE.lastMatchTime = performance.now();
                    onSharkFound(smoothed.name, smoothed.score);
                } else {
                    onSharkLost();
                }
            } catch (e) {
                console.error('Loop error:', e);
            }

            requestAnimationFrame(loop);
        }

        // ─── INIT ───
        async function init() {
            try {
                await loadModel();
                await loadEmbeddings();
                await startCamera();
                startGpsWatch();

                ui.loading.classList.add('hidden');

                STATE.running = true;
                loop();

                // Start GPS tracking
                startGPSTracking();
            } catch (e) {
                ui.loadingStatus.textContent = 'Something went wrong. Please refresh.';
                console.error(e);
            }
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopGPSTracking();
        });

        // Map functionality
        var map = null;
        var userMarker = null;
        var userLat = null;
        var userLng = null;

        function initializeMap() {
            if (map) {
                console.log('[MAP] Map already initialized');
                return;
            }

            console.log('[MAP] Initializing map...');
            var mapContainer = document.getElementById('mini-map');
            if (!mapContainer) {
                console.error('[MAP] Map container not found!');
                return;
            }

            map = L.map(mapContainer, {
                zoomControl: false,
                attributionControl: true
            }).setView([37.3352, -121.8811], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            console.log('[MAP] Map initialized successfully');
        }

        function updateMap() {
            if (!map) {
                console.log('[MAP] Map not initialized, cannot update');
                return;
            }
            if (!userLat || !userLng) {
                console.log('[MAP] No GPS position yet');
                return;
            }

            console.log('[MAP] Updating map with position:', userLat, userLng);
            map.setView([userLat, userLng], 16);

            // Use shared marker system
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.contains('expanded');
            userMarker = updateMapMarkers(map, userLat, userLng, userMarker, isExpanded);
            console.log('[MAP] Map updated with markers');
        }

        document.getElementById('toggle-map').addEventListener('click', function () {
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.toggle('expanded');


            setTimeout(function () {
                if (map) {
                    map.invalidateSize();
                    updateMap();
                }
            }, 400);
        });

        if (navigator.geolocation) {
            console.log('[GPS] Starting geolocation watch...');
            navigator.geolocation.watchPosition(
                function (position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    console.log('[GPS] Position updated:', userLat, userLng, 'accuracy:', position.coords.accuracy + 'm');

                    if (!map) {
                        console.log('[GPS] Map not initialized, initializing now...');
                        initializeMap();
                    }
                    updateMap();
                },
                function (error) {
                    console.error('[GPS] Geolocation error:', error.code, error.message);
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        } else {
            console.error('[GPS] Geolocation not supported by this browser');
        }

        setTimeout(function () {
            if (!map) {
                initializeMap();
            }
        }, 1000);

        init();
    </script>
