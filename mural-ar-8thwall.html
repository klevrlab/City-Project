<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Japantown Living Mural (8th Wall)</title>

    <!-- 8th Wall Engine & Extras (2026 Distributed Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam" async></script>
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous" async></script>

    <!-- Project Source -->
    <script type="module" src="./src/utils/audio-utils.js"></script>
    <script type="module" src="./src/components/mural-overlay.js"></script>
    <script type="module" src="./src/app.js"></script>

    <link rel="stylesheet" href="./src/css/mural-ar-8thwall-styles.css" />
</head>

<body>
    <div id="topbar">
        <a href="./index.html" class="back" aria-label="Back to home">&larr;</a>
        <h1>Japantown Living Mural</h1>
    </div>

    <div id="mural-hint" class="visible">Point your camera at the Japantown memorial mural</div>

    <!-- 8th Wall A-Frame scene -->
    <a-scene id="xrscene"
        xrextras-almost-there
        xrextras-runtime-error
        xrextras-loading
        xrweb
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true;">

        <a-assets>
            <!-- Placeholder animation — swap src for the real animated mural mp4s.
                 muted + playsinline are required for iOS autoplay on found. -->
            <video id="muralVideoFront" src="./assets/video.mp4" loop muted playsinline crossorigin="anonymous"></video>
            <video id="muralVideoBack"  src="./assets/video.mp4" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <!-- Front panel — name must match the 8th Wall console image target -->
        <a-entity xrextras-named-image-target="name: japan-am-front"
                  mural-overlay="name: japan-am-front; video: #muralVideoFront"></a-entity>

        <!-- Back panel -->
        <a-entity xrextras-named-image-target="name: japan-am-back"
                  mural-overlay="name: japan-am-back; video: #muralVideoBack"></a-entity>

        <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
        window.addEventListener('xrloaded', () => {
            console.log('8th Wall Engine Loaded — Japantown Living Mural');
        });
    </script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
