<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Full Shark AR (8th Wall)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    <link rel="stylesheet" href="./src/css/shared-styles.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./src/utils/checkpoint-loader.js"></script>
    <script src="./src/utils/shared-map-markers.js"></script>
    
    <!-- Core AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script src="./src/utils/shark-embedding-detector.js"></script>
    <script src="./src/utils/xr8-shark-video-bridge.js"></script>

    <!-- 1. 8th Wall Engine & Extras (2026 Distributed Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam" async></script>
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous" async></script>
    
    <!-- A-Frame Extras for Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <!-- Project Source -->
    <script src="./src/utils/audio-utils.js"></script>
    <script src="./src/utils/math-utils.js"></script>
    <script src="./src/systems/event-system.js"></script>
    <script src="./src/components/shark-detector.js"></script>
    <script src="./src/components/shark-animator.js"></script>
    <script src="./src/components/tour-ui.js"></script>
    <script src="./src/app.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
        }

        #gyro-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 169, 224, 0.25);
            border: 1px solid rgba(0, 169, 224, 0.4);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
        }

        #spawn-btn {
            position: fixed;
            top: 64px;
            right: 20px;
            z-index: 1000;
            background: rgba(40, 200, 120, 0.25);
            border: 1px solid rgba(40, 200, 120, 0.4);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 22, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 169, 224, 0.2);
            border-top-color: #00A9E0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #tap-instruction {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 109, 117, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 16px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            z-index: 2000;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 169, 224, 0.5);
        }
        #tap-instruction.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <button id="gyro-btn" onclick="fixGyro()">Fix Gyro (iOS)</button>
    <button id="spawn-btn" onclick="if(window.manualSharkSpawn) window.manualSharkSpawn();">Force Spawn / Cycle</button>
    
    <!-- Tap Instruction Overlay -->
    <div id="tap-instruction">Tap the ground to bring a shark to life</div>

    <!-- XRExtras will provide its own loading screen if xrextras-loading is used -->
    
    <!-- 8th Wall A-Frame scene -->
    <a-scene id="xrscene" 
        xrextras-almost-there
        xrextras-runtime-error
        xrextras-loading
        xrweb
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true;"
        tour-ui shark-detector="useGps: true">

        <a-assets>
            <a-asset-item id="maria-swimmer" src="./assets/3D-models/SEAN_ANIMATED_WiTH_MARIA_SHARK.glb"></a-asset-item>
            <a-asset-item id="jimmy-swimmer" src="./assets/3D-models/jimmy-shark-swimmer.glb"></a-asset-item>
            <a-asset-item id="sharkie-wave" src="./assets/3D-models/sharkie_final_pose.glb"></a-asset-item>
            <a-asset-item id="diving-shark" src="./assets/3D-models/maria-shark-jump-jimmy-txtr.glb"></a-asset-item>
            <a-asset-item id="stella-swimmer" src="./assets/3D-models/STELLA_CAI_SHARK_SJSU_TEST1.glb"></a-asset-item>
        </a-assets>

        <!-- Lighting for AR Shadows -->
        <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
        <a-entity light="type: directional; castShadow: true; intensity: 0.8; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowCameraTop: 20; shadowCameraBottom: -20; shadowCameraRight: 20; shadowCameraLeft: -20; target: #camera" position="5 10 5"></a-entity>

        <!-- Shadow Ground Plane (Clickable for spawning) -->
        <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="1000" height="1000" material="shader: shadow; opacity: 0.4;" shadow="receive: true"></a-plane>

        <!-- Shark Content -->
        <a-entity id="shark-root" position="0 0 0" visible="false" shark-animator>
        </a-entity>

        <a-camera id="camera" position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // Start logic - 8th Wall components on a-scene will handle run()
        window.addEventListener('xrloaded', () => {
            console.log('8th Wall Engine Loaded');
        });

        // iOS 13+ DeviceOrientation Permission
        window.fixGyro = () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        console.log('Gyro permission state:', permissionState);
                        if (permissionState === 'granted') {
                            alert('Gyroscope permissions granted! AR tracking should be improved.');
                        } else {
                            alert('Gyroscope permissions denied. AR tracking may not work correctly.');
                        }
                    })
                    .catch(e => {
                        console.error('Gyro request failed:', e);
                        alert('Could not request Gyroscope permissions.');
                    });
            } else {
                console.log('Gyro permission not required on this device');
                alert('Gyroscope permission is not required or not supported on this device.');
            }
        };
    </script>

    <!-- GPS Tracking -->
    <script src="./src/utils/shared-gps-tracking.js"></script>
</body>

</html>
