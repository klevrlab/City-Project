<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Shark Detection (8th Wall)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./src/utils/checkpoint-loader.js"></script>
    <script src="./src/utils/shared-map-markers.js"></script>
    
    <!-- Core AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script src="./src/utils/shark-embedding-detector.js"></script>
    <script src="./src/utils/xr8-shark-video-bridge.js"></script>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 8th Wall Engine -->
    <script src="./external/xr/xr.js"></script>

    <!-- XR Extras -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"></script>

    <!-- Simplified bootstrap -->
    <script src="./src/utils/xr8-scene-bootstrap.js"></script>

    <!-- Project Source -->
    <script src="./src/utils/audio-utils.js"></script>
    <script src="./src/utils/math-utils.js"></script>
    <script src="./src/systems/event-system.js"></script>
    <script src="./src/components/shark-detector.js"></script>
    <script src="./src/components/tour-ui.js"></script>
    <script src="./src/app.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }

        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 14px;
            background: linear-gradient(to bottom, rgba(0, 22, 26, 0.7) 0%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1001;
        }

        #topbar h1 {
            font-size: 14px;
            font-weight: 700;
            flex: 1;
            color: white;
        }

        #topbar .back {
            color: #00A9E0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        #hamburger-btn {
            background: rgba(0, 169, 224, 0.25);
            border: 1px solid rgba(0, 169, 224, 0.4);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: auto;
            position: relative;
            z-index: 1002;
        }

        #nav-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(0, 22, 26, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 169, 224, 0.3);
            z-index: 1050;
            transition: right 0.3s ease;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }

        #nav-menu.open { right: 0; }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: rgba(0, 169, 224, 0.1);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        #nav-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #nav-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 109, 117, 0.25);
            backdrop-filter: blur(20px);
            color: white;
            padding: 18px 16px;
            border-radius: 20px;
            z-index: 1000;
            width: 160px;
            border: 1px solid rgba(0, 169, 224, 0.3);
        }

        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 22, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 169, 224, 0.2);
            border-top-color: #00A9E0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2 style="color:white; margin-top:16px;">Loading Shark AI</h2>
        <p style="color:#aaa; font-size:13px;" id="loading-status">Preparing model…</p>
    </div>

    <!-- Top bar -->
    <div id="topbar">
        <a href="./index.html" class="back">&larr;</a>
        <h1>Shark Detection (8W)</h1>
        <button id="hamburger-btn">
            <svg style="width:20px; height:20px; stroke:white; fill:none;" viewBox="0 0 24 24">
                <line x1="3" y1="6" x2="21" y2="6" stroke-width="2"/>
                <line x1="3" y1="12" x2="21" y2="12" stroke-width="2"/>
                <line x1="3" y1="18" x2="21" y2="18" stroke-width="2"/>
            </svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <div id="nav-overlay"></div>
    <div id="nav-menu">
        <h2 style="color:#00A9E0; font-size:18px; margin-bottom:20px;">Navigation</h2>
        <a href="./sharks-way.html" class="nav-link">Sharks Way (Standard)</a>
        <a href="./location-tour.html" class="nav-link">Location Tour</a>
        <a href="./marker-demo.html" class="nav-link">Marker (AR.js)</a>
        <a href="./selfie-ar.html" class="nav-link">Selfie AR</a>
        <a href="./sharks-way-8thwall.html" class="nav-link">Detection (8th Wall)</a>
    </div>

    <div id="info-panel">
        <h2 style="font-size:14px; margin-bottom:8px;">8th Wall Detection</h2>
        <p style="font-size:12px; opacity:0.8;">Point at a sidewalk shark painting.</p>
    </div>

    <!-- 8th Wall A-Frame scene -->
    <a-scene id="xrscene" embedded vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        tour-ui shark-detector="useGps: true">

        <a-assets>
            <a-asset-item id="shark-model" src="./assets/3D-models/plushie_shark.glb"></a-asset-item>
        </a-assets>

        <!-- Shark Content -->
        <a-entity id="shark-root" position="0 0 -2" visible="false">
            <a-entity gltf-model="#shark-model" scale="0.5 0.5 0.5"
                animation="property: position; to: 0 0.1 0; dir: alternate; loop: true; dur: 2000;">
            </a-entity>
            <a-cylinder position="0 -0.2 0" radius="0.6" height="0.1" color="#F4901E"></a-cylinder>
            <a-text value="Shark Found!" align="center" position="0 1 0" scale="0.5 0.5 0.5"></a-text>
        </a-entity>

        <a-camera id="camera"></a-camera>
    </a-scene>

    <script>
        // Start 8th Wall
        XR8SceneBootstrap.start({
            scene: document.getElementById('xrscene')
        });

        // Simple Menu Logic
        const navMenu = document.getElementById('nav-menu');
        const navOverlay = document.getElementById('nav-overlay');
        const hamburgerBtn = document.getElementById('hamburger-btn');
        
        hamburgerBtn.addEventListener('click', () => {
            navMenu.style.right = '0';
            navOverlay.classList.add('visible');
        });
        
        navOverlay.addEventListener('click', () => {
            navMenu.style.right = '-100%';
            navOverlay.classList.remove('visible');
        });
    </script>

    <!-- GPS Tracking for Checkpoints -->
    <script src="./src/utils/shared-gps-tracking.js"></script>
</body>

</html>
