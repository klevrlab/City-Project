<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Japantown Living Mural (Open-Source AR)</title>

    <!-- Open-source stack: stock A-Frame + our custom MindAR build (no cloud, no backend).
         The custom bundle is MindAR 1.2.5 compiled from source with loosened
         confidence thresholds so the bronze relief locks on much more easily —
         rebuild with `npm run build-tracker` in tools/mind-compile/. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="./assets/vendor/mindar-image-aframe.custom.js"></script>

    <!-- Project source -->
    <script type="module" src="./src/utils/math-utils.js"></script>
    <script type="module" src="./src/utils/audio-utils.js"></script>
    <script type="module" src="./src/components/mural-geo-gate.js"></script>
    <script type="module" src="./src/components/mural-plane.js"></script>

    <link rel="stylesheet" href="./src/css/mural-ar-styles.css" />
</head>

<body>
    <div id="topbar">
        <a href="./index.html" class="back" aria-label="Back to home">&larr;</a>
        <h1>Japantown Living Mural</h1>
    </div>

    <div id="mural-status" class="visible">Finding your location…</div>
    <button id="mural-start">Start</button>

    <!--
      MindAR scene. autoStart:false so the GPS gate controls when the camera
      turns on. assets/targets/japan-am.mind holds a single compiled target
      (the front relief) — recompile via `npm run compile-targets` in
      tools/mind-compile/ when better on-site photos are available.
    -->
    <a-scene
        mindar-image="imageTargetSrc: ./assets/targets/japan-am.mind; autoStart: false; uiScanning: no; uiLoading: no; maxTrack: 1; missTolerance: 30; warmupTolerance: 2; filterMinCF: 0.001; filterBeta: 0.05"
        mural-geo-gate="lat: 37.334900; lng: -121.894400; radius: 40; bypass: true"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- Placeholder animation — swap src for the real animated mural mp4.
                 muted + playsinline are required for iOS autoplay. -->
            <video id="muralVideoFront" src="./assets/video.mp4" preload="auto" loop muted playsinline crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Single target: the front relief panel (targetIndex 0). Multiple
             similar-looking bronze panels cross-matched and caused phantom
             locks, so the experience tracks only this one. Plane width 1 =
             mural width; height = 1349/3336 = 0.4045 to match the photo. -->
        <a-entity mindar-image-target="targetIndex: 0" mural-plane="video: #muralVideoFront">
            <a-plane width="1" height="0.4045"
                     material="shader: flat; src: #muralVideoFront; side: double"></a-plane>
        </a-entity>
    </a-scene>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
